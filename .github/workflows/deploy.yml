name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject secrets into config.js
        shell: bash
        run: |
          KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -n "$KEY" ] && [ -f "app/config.js" ]; then
            sed -i "s/__GEMINI_API_KEY__/$KEY/g" app/config.js
            echo "Gemini API key injected successfully."
          else
            echo "No GEMINI_API_KEY secret provided. Site will run in offline mock fallback mode."
          fi

          ADMIN_PW="${{ secrets.ADMIN_PASSWORD }}"
          if [ -n "$ADMIN_PW" ] && [ -f "app/config.js" ]; then
            sed -i "s/__ADMIN_PASSWORD__/$ADMIN_PW/g" app/config.js
            echo "Admin password injected successfully."
          else
            echo "No ADMIN_PASSWORD secret provided. Site will fall back to the local default password."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
